<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskPier 任务看板 · 港务调度</title>
<style>
  /* ---- tokens: 海雾夜航 / 海雾白昼 ---- */
  :root {
    color-scheme: light dark;
    --bg:#E8EEF3; --surface:#F7FAFC; --card:#FFFFFF;
    --ink:#16212E; --muted:#5B7086; --line:#D5DFE8;
    --brand:#FF7A1A;
    --lamp-run:#1FA971; --lamp-dec:#C77F00; --lamp-blk:#D94848; --lamp-rev:#2B7FD4;
    --shadow:0 1px 2px rgba(22,33,46,.06), 0 4px 14px rgba(22,33,46,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0C1420; --surface:#121D2B; --card:#182433;
      --ink:#DCE8F2; --muted:#7E93A8; --line:#24344A;
      --lamp-run:#3ECF8E; --lamp-dec:#FFB020; --lamp-blk:#FF5C5C; --lamp-rev:#4DA3FF;
      --shadow:0 1px 2px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 "PingFang SC","MiSans","Microsoft YaHei",system-ui,sans-serif; }
  .mono { font-family:ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace; }

  /* ---- header + lamp strip (signature) ---- */
  header { padding:20px 26px 0; display:flex; flex-wrap:wrap; align-items:center; gap:14px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--brand); box-shadow:0 0 8px var(--brand); }
  .brand b { font-size:17px; letter-spacing:.5px; }
  .brand span { color:var(--muted); font-size:13px; }
  .lamps { display:flex; gap:10px; flex-wrap:wrap; }
  .lamp { display:flex; align-items:center; gap:9px; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:7px 14px 7px 10px; }
  .lamp .bulb { width:12px; height:12px; border-radius:50%; background:var(--line); transition:all .3s; }
  .lamp .v { font-size:20px; font-weight:700; min-width:22px; text-align:center; }
  .lamp .l { font-size:12px; color:var(--muted); }
  .lamp.on.run .bulb { background:var(--lamp-run); box-shadow:0 0 10px var(--lamp-run); }
  .lamp.on.dec .bulb { background:var(--lamp-dec); box-shadow:0 0 10px var(--lamp-dec); }
  .lamp.on.blk .bulb { background:var(--lamp-blk); box-shadow:0 0 10px var(--lamp-blk); }
  .lamp.on.rev .bulb { background:var(--lamp-rev); box-shadow:0 0 10px var(--lamp-rev); }
  .lamp.off .v { color:var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .lamp.on.dec .bulb, .lamp.on.blk .bulb { animation:breathe 2.4s ease-in-out infinite; }
    .card.dec .bar, .card.blk .bar { animation:glow 2.4s ease-in-out infinite; }
    .card { animation:fadeIn .22s ease-out; }
  }
  @keyframes breathe { 50% { opacity:.55; box-shadow:0 0 16px 3px currentColor; } }
  @keyframes glow { 50% { box-shadow:0 0 8px 1px currentColor; } }
  .meta { margin-left:auto; text-align:right; font-size:12px; color:var(--muted); }
  .meta .mode { display:inline-block; border:1px solid var(--line); border-radius:6px;
    padding:1px 8px; margin-bottom:3px; }

  /* ---- calm strip ---- */
  .calm { margin:14px 26px 0; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); padding:10px 16px; display:flex; align-items:center; gap:12px; }
  .calm .bulb { width:12px; height:12px; border-radius:50%; background:var(--lamp-run);
    box-shadow:0 0 10px var(--lamp-run); flex:none; }
  .calm b { font-size:14px; }
  .calm span { color:var(--muted); font-size:12.5px; }

  /* ---- berth columns ---- */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:14px; padding:16px 26px 6px; }
  .col { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; min-height:130px; }
  .col-head { display:flex; align-items:center; gap:8px; padding:2px 4px 10px;
    border-bottom:1px solid var(--line); margin-bottom:10px; }
  .col-head .bulb { width:9px; height:9px; border-radius:50%; }
  .col-head b { font-size:14px; }
  .col-head .n { margin-left:auto; font-size:13px; color:var(--muted); }
  .col.run  .col-head .bulb { background:var(--lamp-run); }
  .col.dec  .col-head .bulb { background:var(--lamp-dec); }
  .col.blk  .col-head .bulb { background:var(--lamp-blk); }
  .col.rev  .col-head .bulb { background:var(--lamp-rev); }
  .empty { font-size:12.5px; color:var(--muted); padding:16px 4px; text-align:center; }

  /* ---- task card: status = colored vertical bar ---- */
  .card { position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:11px 13px 11px 17px; margin-bottom:10px;
    box-shadow:var(--shadow); overflow:hidden; }
  .card:last-child { margin-bottom:2px; }
  .card .bar { position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line); }
  .card.run .bar { background:var(--lamp-run); }
  .card.dec .bar { background:var(--lamp-dec); }
  .card.blk .bar { background:var(--lamp-blk); }
  .card.rev .bar { background:var(--lamp-rev); }
  .card.run .bar { box-shadow:0 0 6px var(--lamp-run); }
  .card.rev .bar { box-shadow:0 0 6px var(--lamp-rev); }
  .card.dec .bar { box-shadow:0 0 6px var(--lamp-dec); }
  .card.blk .bar { box-shadow:0 0 6px var(--lamp-blk); }
  .card .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card .id { font-size:12px; color:var(--muted); }
  .pill { font-size:11.5px; font-weight:600; padding:1px 9px; border-radius:999px; }
  .pill.run { color:var(--lamp-run); background:color-mix(in srgb, var(--lamp-run) 12%, transparent); }
  .pill.dec { color:var(--lamp-dec); background:color-mix(in srgb, var(--lamp-dec) 14%, transparent); }
  .pill.blk { color:var(--lamp-blk); background:color-mix(in srgb, var(--lamp-blk) 14%, transparent); }
  .pill.rev { color:var(--lamp-rev); background:color-mix(in srgb, var(--lamp-rev) 12%, transparent); }
  .card .title { font-size:14.5px; font-weight:600; margin:7px 0 2px; line-height:1.5; }
  .card .why { font-size:12.5px; color:var(--muted); margin:6px 0 0; padding:7px 10px;
    border-radius:8px; background:var(--surface); white-space:pre-wrap; }
  .card .act { font-size:12.5px; margin:7px 0 0; padding:6px 10px; border-radius:8px;
    background:color-mix(in srgb, var(--brand) 9%, var(--card));
    border-left:3px solid var(--brand); }
  .card .act b { color:var(--brand); }
  .card .meta2 { font-size:11.5px; color:var(--muted); margin-top:7px; word-break:break-all; }

  /* ---- collapsed groups ---- */
  .groups { padding:8px 26px 4px; display:grid; gap:8px; }
  details.group { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; }
  details.group summary { cursor:pointer; color:var(--muted); font-size:13px;
    display:flex; align-items:center; gap:8px; list-style:none; }
  details.group summary::-webkit-details-marker { display:none; }
  details.group summary .n { font-weight:700; color:var(--ink); }
  details.group summary::after { content:"展开"; margin-left:auto; font-size:11px; }
  details.group[open] summary::after { content:"收起"; }
  details.group .wrap { margin-top:10px; }

  footer { padding:14px 26px 22px; font-size:12px; color:var(--muted);
    display:flex; gap:14px; flex-wrap:wrap; }
  a { color:var(--brand); text-decoration:none; }
  a:focus-visible, summary:focus-visible { outline:2px solid var(--brand); outline-offset:2px; border-radius:4px; }
  @media (max-width: 700px) { .grid { grid-template-columns:1fr; } .lamps { width:100%; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><b>TaskPier</b><span>任务看板 · 港务调度</span></div>
  <div class="lamps" id="lamps"></div>
  <div class="meta"><span class="mode" id="modeTag">实时</span><br><span class="mono" id="stamp"></span></div>
</header>

<div class="calm" id="calm" hidden>
  <span class="bulb"></span>
  <div><b>港湾平静</b>　<span id="calmDetail"></span></div>
</div>

<main class="grid" id="grid" aria-label="四个状态泊位"></main>

<section class="groups">
  <details class="group" id="g-todo"><summary>🗓 待派 / 收件箱 <span class="n">0</span></summary><div class="wrap"></div></details>
  <details class="group" id="g-done"><summary>🏁 已完成 <span class="n">0</span></summary><div class="wrap"></div></details>
  <details class="group" id="g-dead"><summary>🗑 失败 / 已取消 <span class="n">0</span></summary><div class="wrap"></div></details>
</section>

<footer>
  <span>数据源：本机任务库</span><span id="footmode"></span>
</footer>

<script>window.__TASKPIER_BOOT__=/*__BOOT__*/null;</script>
<script>
const boot = window.__TASKPIER_BOOT__;
const isSnap = !!(boot && boot.mode === 'snapshot');
const LABEL = { running:'执行中', waiting_decision:'待决策', blocked:'阻塞', review:'待验收',
                todo:'待派', inbox:'收件箱', done:'完成', failed:'失败', cancelled:'已取消' };
const GLYPH = { running:'▶', waiting_decision:'❓', blocked:'⛔', review:'✅',
                todo:'🗓', inbox:'📥', done:'🏁', failed:'💥', cancelled:'🚫' };
const PILL  = { running:'run', waiting_decision:'dec', blocked:'blk', review:'rev' };
const COLS  = ['running','waiting_decision','blocked','review'];

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtTime(iso){ try { return new Date(iso).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch { return iso; } }

function actionLine(t){
  const ref = t.ref || t.displayId;
  if (t.status === 'waiting_decision') {
    const opts = Array.isArray(t.decision_options) ? t.decision_options : [];
    return opts.length ? `👉 回复选项文字即可：<b>${opts.map(esc).join(' / ')}</b>` : `👉 直接回复你的决定（${esc(ref)}）`;
  }
  if (t.status === 'blocked') return `👉 到 ZCode 解除阻塞${ref ? `，或回复「取消 <b>${esc(ref)}</b>」` : ''}`;
  if (t.status === 'review') return `👉 回复「<b>通过 ${esc(ref)}</b>」完成验收，或「打回 ${esc(ref)}」附意见`;
  return '';
}

function card(t){
  const bits = [t.host, t.project, t.workspace].filter(Boolean).map(esc).join(' · ');
  const ref = t.ref || t.displayId;
  const why = t.blocked_reason ? `<div class="why">原因：${esc(t.blocked_reason)}</div>`
            : t.decision_question ? `<div class="why">问题：${esc(t.decision_question)}</div>` : '';
  const act = actionLine(t);
  return `<article class="card ${PILL[t.status]||'run'}">
    <span class="bar"></span>
    <div class="top"><span class="id mono" title="${esc(t.displayId)}">${esc(ref)}</span>
      <span class="pill ${PILL[t.status]||'run'}">${GLYPH[t.status]||''} ${LABEL[t.status]||t.status}</span></div>
    <div class="title">${esc(t.title)}</div>
    ${why}${act ? `<div class="act">${act}</div>` : ''}
    <div class="meta2">${bits?bits+' · ':''}更新 ${esc(fmtTime(t.updatedAt))}</div>
  </article>`;
}

function render(d){
  document.getElementById('lamps').innerHTML = COLS.map(s => {
    const n = d.counts[s] || 0, on = n > 0;
    const cls = { running:'run', waiting_decision:'dec', blocked:'blk', review:'rev' }[s];
    return `<div class="lamp ${cls} ${on?'on':'off'}"><span class="bulb"></span>
      <span class="v">${n}</span><span class="l">${LABEL[s]}</span></div>`;
  }).join('');
  document.getElementById('stamp').textContent = fmtTime(d.generatedAt);

  document.getElementById('grid').innerHTML = COLS.map(s => {
    const list = d.columns[s] || [];
    return `<section class="col ${PILL[s]}" aria-label="${LABEL[s]}">
      <div class="col-head"><span class="bulb"></span><b>${LABEL[s]}</b><span class="n mono">${list.length}</span></div>
      ${list.length ? list.map(card).join('') : '<div class="empty">泊位空闲，暂无任务</div>'}
    </section>`;
  }).join('');

  const attN = (d.counts.waiting_decision||0) + (d.counts.blocked||0) + (d.counts.review||0);
  const calm = document.getElementById('calm');
  if (!attN) {
    calm.hidden = false;
    document.getElementById('calmDetail').textContent =
      `没有任务等你处理${d.counts.running ? `，执行中 ${d.counts.running} 条` : ''}。`;
  } else {
    calm.hidden = true;
  }

  const groups = [ ['g-todo',['todo','inbox']], ['g-done',['done']], ['g-dead',['failed','cancelled']] ];
  for (const [gid, sts] of groups) {
    const el = document.getElementById(gid);
    const list = sts.flatMap(s => d.columns[s] || []);
    el.querySelector('.n').textContent = list.length;
    el.querySelector('.wrap').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">暂无记录</div>';
  }
}

if (isSnap) {
  document.getElementById('modeTag').textContent = '快照';
  document.getElementById('footmode').textContent =
    '⏱ 快照生成于 ' + fmtTime(boot.data.generatedAt) + '，非实时；数据变化后由负责人重新发布 · 实时看板在本机 TaskPier board 服务';
  render(boot.data);
} else {
  document.getElementById('footmode').textContent = '本地实时 · 每 8 秒自动刷新';
  async function load(){
    try { const r = await fetch('/api/board'); if (r.ok) render(await r.json()); } catch {}
  }
  load(); setInterval(load, 8000);
}
</script>
</body>
</html>
