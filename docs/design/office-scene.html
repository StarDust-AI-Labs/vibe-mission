<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VibeMission · 一图看懂</title>
<style>
  :root{
    --bg:#fcfbf8; --ink:#14181d; --ink2:#4a5561; --muted:#8a949e;
    --line:#e4dfd4; --accent:#0f766e; --accent2:#eaf4f2;
    --amber:#b45309; --amber2:#fdf1e3; --paper:#ffffff;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7}
  .wrap{max-width:1240px;margin:0 auto;padding:48px 24px 64px}
  h1{font-size:clamp(26px,3.6vw,38px);margin:0 0 10px;letter-spacing:-.01em}
  .sub{color:var(--ink2);margin:0 0 28px;max-width:780px}
  .board{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px}
  svg{width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:20px;margin-top:18px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
  .legend i.dash{border-top:2px dashed var(--amber)}
  .note{margin-top:22px;font-size:13.5px;color:var(--muted)}
  .flowline{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-12}}
  @media (prefers-reduced-motion: reduce){.flowline{animation:none}}
  text{font-family:var(--sans)}
</style>
</head>
<body>
<div class="wrap">
  <h1>一张图：人、负责人、办公室、任务会话</h1>
  <p class="sub">上面一层是人：用自然语言跟每个产品的工程负责人说话。下面一层是办公室：每个产品一间，里面坐着负责人，任务从他的桌上分发出去，交给一个个任务会话去干。</p>

  <div class="board">
  <svg viewBox="0 0 1200 880" role="img" aria-label="人类与多个 agent 产品负责人的两层结构图">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
      </marker>
      <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
      </marker>
    </defs>

    <!-- ===== 上层：人 ===== -->
    <g>
      <circle cx="600" cy="52" r="22" fill="#eaf4f2" stroke="#0f766e" stroke-width="1.5"/>
      <circle cx="600" cy="45" r="7" fill="#0f766e"/>
      <path d="M588 62 q12 -10 24 0" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
      <text x="600" y="96" text-anchor="middle" font-size="14" font-weight="600">你</text>
      <text x="600" y="114" text-anchor="middle" font-size="11.5" fill="#8a949e">自然语言 · 飞书</text>
    </g>

    <!-- 人的两句话 -->
    <g>
      <rect x="655" y="26" width="250" height="34" rx="17" fill="#ffffff" stroke="#e4dfd4"/>
      <text x="672" y="48" font-size="12.5" fill="#4a5561">「分享页字号太小，帮我改一下」</text>
      <rect x="655" y="68" width="196" height="34" rx="17" fill="#ffffff" stroke="#e4dfd4"/>
      <text x="672" y="90" font-size="12.5" fill="#4a5561">「12 号那个怎么样了？」</text>
    </g>

    <!-- 人 → 两个负责人 -->
    <path d="M578 74 C 470 120, 400 130, 332 166" fill="none" stroke="#0f766e" stroke-width="1.6" class="flowline" marker-end="url(#arrow)"/>
    <path d="M622 74 C 730 120, 800 130, 868 166" fill="none" stroke="#0f766e" stroke-width="1.6" class="flowline" marker-end="url(#arrow)"/>

    <!-- 负责人 → 人（汇报，虚线） -->
    <path d="M356 166 C 420 128, 500 96, 576 80" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>
    <path d="M844 166 C 780 128, 700 96, 624 80" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>

    <!-- ===== 负责人 ===== -->
    <g>
      <rect x="192" y="170" width="280" height="78" rx="14" fill="#eaf4f2" stroke="#0f766e" stroke-width="1.6"/>
      <text x="332" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#0b4f4a">ZCode 工程负责人</text>
      <text x="332" y="222" text-anchor="middle" font-size="11.5" fill="#3d4a57">登记 · 派工 · 催办 · 汇总汇报</text>
      <text x="332" y="239" text-anchor="middle" font-size="10.5" fill="#0f766e">在执行中 2 · 待验收 1</text>
    </g>
    <g>
      <rect x="728" y="170" width="280" height="78" rx="14" fill="#fdf1e3" stroke="#e0c39d" stroke-width="1.4" stroke-dasharray="6 4"/>
      <text x="868" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#8a4b0a">WorkBuddy 工程负责人</text>
      <text x="868" y="222" text-anchor="middle" font-size="11.5" fill="#8a6a4b">登记 · 派工 · 对账 · 汇总汇报</text>
      <text x="868" y="239" text-anchor="middle" font-size="10.5" fill="#b45309">在执行中 1 · 阻塞 1</text>
    </g>

    <!-- 负责人 → 办公室 -->
    <line x1="332" y1="248" x2="332" y2="330" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="868" y1="248" x2="868" y2="330" stroke="#cfc6b6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>

    <!-- ===== 办公室 A：ZCode ===== -->
    <g>
      <rect x="96" y="336" width="472" height="424" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
      <rect x="108" y="348" width="448" height="400" rx="12" fill="#fbfaf6" stroke="#eae5da" stroke-dasharray="4 4"/>
      <text x="120" y="372" font-size="13" font-weight="600" fill="#0b4f4a">ZCode 办公室</text>
      <text x="470" y="372" text-anchor="end" font-size="11" fill="#8a949e">私有：只写这里</text>

      <!-- 负责人的桌子 -->
      <rect x="256" y="392" width="152" height="52" rx="8" fill="#eaf4f2" stroke="#bfe0da"/>
      <text x="332" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#0b4f4a">负责人 · 桌</text>
      <text x="332" y="431" text-anchor="middle" font-size="10.5" fill="#0f766e">接单 / 派工 / 写账本</text>

      <!-- 账本提示 -->
      <rect x="128" y="392" width="104" height="52" rx="8" fill="#fff" stroke="#e4dfd4"/>
      <text x="180" y="414" text-anchor="middle" font-size="11" fill="#4a5561">shared</text>
      <text x="180" y="430" text-anchor="middle" font-size="10" fill="#8a949e">账本 + 任务卡</text>
      <line x1="232" y1="418" x2="254" y2="418" stroke="#9aa4ad" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 任务分发线 -->
      <path d="M332 444 L206 500" stroke="#9aa4ad" stroke-width="1.2"/>
      <path d="M332 444 L332 500" stroke="#9aa4ad" stroke-width="1.2"/>
      <path d="M332 444 L458 500" stroke="#9aa4ad" stroke-width="1.2"/>

      <!-- 三个任务 -->
      <g>
        <rect x="150" y="504" width="112" height="58" rx="9" fill="#fff" stroke="#bfe0da"/>
        <text x="206" y="526" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0b4f4a">#12 分享页</text>
        <text x="206" y="544" text-anchor="middle" font-size="10.5" fill="#0f766e">执行中</text>
      </g>
      <g>
        <rect x="276" y="504" width="112" height="58" rx="9" fill="#fff" stroke="#dfd8c8"/>
        <text x="332" y="526" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a5561">#13 首页加载</text>
        <text x="332" y="544" text-anchor="middle" font-size="10.5" fill="#b45309">待验收</text>
      </g>
      <g>
        <rect x="402" y="504" width="112" height="58" rx="9" fill="#fff" stroke="#dfd8c8"/>
        <text x="458" y="526" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a5561">#14 模板包</text>
        <text x="458" y="544" text-anchor="middle" font-size="10.5" fill="#8a949e">待派</text>
      </g>

      <!-- 任务会话 -->
      <line x1="206" y1="562" x2="206" y2="622" stroke="#c9c3b6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="332" y1="562" x2="332" y2="622" stroke="#c9c3b6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="458" y1="562" x2="458" y2="622" stroke="#c9c3b6" stroke-width="1.2" marker-end="url(#arrow)"/>

      <g>
        <rect x="146" y="626" width="120" height="46" rx="23" fill="#f4f2ec" stroke="#e4dfd4"/>
        <text x="206" y="654" text-anchor="middle" font-size="10.5" fill="#4a5561">任务会话 A</text>
      </g>
      <g>
        <rect x="272" y="626" width="120" height="46" rx="23" fill="#f4f2ec" stroke="#e4dfd4"/>
        <text x="332" y="654" text-anchor="middle" font-size="10.5" fill="#4a5561">任务会话 B</text>
      </g>
      <g>
        <rect x="398" y="626" width="120" height="46" rx="23" fill="#f4f2ec" stroke="#e4dfd4"/>
        <text x="458" y="654" text-anchor="middle" font-size="10.5" fill="#8a949e">（排队中）</text>
      </g>

      <text x="332" y="706" text-anchor="middle" font-size="11" fill="#8a949e">任务会话真正干活 · 状态回写账本</text>
    </g>

    <!-- ===== 办公室 B：WorkBuddy ===== -->
    <g>
      <rect x="632" y="336" width="472" height="424" rx="18" fill="#ffffff" stroke="#dfd8c8" stroke-width="1.4" stroke-dasharray="7 5"/>
      <rect x="644" y="348" width="448" height="400" rx="12" fill="#fdfcf9" stroke="#f0ece2" stroke-dasharray="4 4"/>
      <text x="656" y="372" font-size="13" font-weight="600" fill="#8a4b0a">WorkBuddy 办公室</text>
      <text x="1006" y="372" text-anchor="end" font-size="11" fill="#8a949e">私有：只写这里</text>

      <rect x="792" y="392" width="152" height="52" rx="8" fill="#fdf1e3" stroke="#e0c39d"/>
      <text x="868" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#8a4b0a">负责人 · 桌</text>
      <text x="868" y="431" text-anchor="middle" font-size="10.5" fill="#b45309">接单 / 派工 / 对账</text>

      <rect x="664" y="392" width="104" height="52" rx="8" fill="#fff" stroke="#e4dfd4"/>
      <text x="716" y="414" text-anchor="middle" font-size="11" fill="#4a5561">shared</text>
      <text x="716" y="430" text-anchor="middle" font-size="10" fill="#8a949e">账本 + 任务卡</text>
      <line x1="768" y1="418" x2="790" y2="418" stroke="#9aa4ad" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M868 444 L742 500" stroke="#9aa4ad" stroke-width="1.2"/>
      <path d="M868 444 L868 500" stroke="#9aa4ad" stroke-width="1.2"/>

      <g>
        <rect x="686" y="504" width="112" height="58" rx="9" fill="#fff" stroke="#dfd8c8"/>
        <text x="742" y="526" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a5561">#7 模板合规</text>
        <text x="742" y="544" text-anchor="middle" font-size="10.5" fill="#b45309">执行中</text>
      </g>
      <g>
        <rect x="812" y="504" width="112" height="58" rx="9" fill="#fff" stroke="#dfd8c8"/>
        <text x="868" y="526" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a5561">#9 素材整理</text>
        <text x="868" y="544" text-anchor="middle" font-size="10.5" fill="#8a949e">阻塞</text>
      </g>

      <line x1="742" y1="562" x2="742" y2="622" stroke="#c9c3b6" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="868" y1="562" x2="868" y2="622" stroke="#c9c3b6" stroke-width="1.2" marker-end="url(#arrow)"/>

      <g>
        <rect x="682" y="626" width="120" height="46" rx="23" fill="#f4f2ec" stroke="#e4dfd4"/>
        <text x="742" y="654" text-anchor="middle" font-size="10.5" fill="#4a5561">任务会话 C</text>
      </g>
      <g>
        <rect x="808" y="626" width="120" height="46" rx="23" fill="#f4f2ec" stroke="#e4dfd4"/>
        <text x="868" y="654" text-anchor="middle" font-size="10.5" fill="#8a949e">（等授权）</text>
      </g>

      <text x="868" y="706" text-anchor="middle" font-size="11" fill="#8a949e">同上：干完回写，失败即报</text>
    </g>

    <!-- 跨产品转派（示例，虚线） -->
    <path d="M462 534 C 600 534, 640 534, 686 534" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arrowAmber)"/>
    <text x="574" y="522" text-anchor="middle" font-size="10.5" fill="#b45309">任务可跨产品转派（留 handoff）</text>
  </svg>
  </div>

  <div class="legend">
    <span><i></i>下发 / 派工</span>
    <span><i class="dash"></i>汇报 / 转派</span>
    <span>实线办公室 = 已接入；虚线办公室 = 待接入</span>
  </div>

  <p class="note">
    这张图只表达结构，不代表具体排期：每个产品一间办公室、一位负责人；任务是账本里的记录，能在产品之间转派；任务会话只负责干，不负责记事。
  </p>
</div>
</body>
</html>
